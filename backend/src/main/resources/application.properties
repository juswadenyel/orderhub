spring.application.name=orderhub

# --- Database (Supabase Postgres) ---
# Never hardcode these. Set them as real environment variables before
# running the app (see README "Environment variables" section).
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# We create/seed tables ourselves with sql/supabase_schema.sql, so Hibernate
# should never try to auto-generate or alter schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

server.port=8080

# CORS — matches Vite's default dev port. Override via env var if needed.
frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}
