spring.application.name=orderhub

spring.profiles.active=local

# --- Database (Supabase Postgres) ---
# Never hardcode these. Real values go in application-local.properties
# (gitignored) or real environment variables — never here.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

server.port=8080

frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}

# --- LegacySupply (Lab 3) ---
legacysupply.base-url=https://legacysupply.onrender.com/api/v1
legacysupply.client-id=${LS_CLIENT_ID}
legacysupply.api-key=${LS_API_KEY}
# "SupplierSku:PackSize" from your own GET /catalog call (see INTEGRATION.md).
legacysupply.mapping.P100=${LS_MAPPING_P100:}
legacysupply.mapping.P200=${LS_MAPPING_P200:}
legacysupply.mapping.P300=${LS_MAPPING_P300:}

# --- Tiangge (Lab 4) ---
tiangge.base-url=https://legacysupply.onrender.com/tiangge/v1
tiangge.client-id=${TG_CLIENT_ID}
tiangge.api-key=${TG_API_KEY}
# "sellerSku:title:supplierSku" — your own product IDs/names for Tiangge,
# and the SAME SupplierSku you used above, so a listing and a reorder for
# the same product always point at the same LegacySupply catalog item.
tiangge.listing.P100=${TG_LISTING_P100:}
tiangge.listing.P200=${TG_LISTING_P200:}
tiangge.listing.P300=${TG_LISTING_P300:}
